<label class="theme-switcher">
  <span class="theme-switcher__label">Theme</span>
  <select class="theme-switcher__select" (change)="onChange($event)">
    @for (option of options; track option.id) {
      <option [value]="option.id" [selected]="option.id === theme.choice()">
        {{ option.label }}
      </option>
    }
  </select>
</label>
