<footer class="site-footer">
  <div class="container site-footer__inner">
    <p class="site-footer__name">{{ i18n.t().site.name }}</p>
    <ul class="site-footer__links">
      <li>
        <a [href]="'mailto:' + links.email">{{ i18n.t().footer.email }}</a>
      </li>
      <li><a [href]="links.linkedin" rel="noopener">LinkedIn</a></li>
      <li><a [href]="links.github" rel="noopener">GitHub</a></li>
    </ul>
    <p class="site-footer__note">{{ i18n.t().footer.note }}</p>
  </div>
</footer>
