name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx ng test --no-watch

      - name: Production build (preview base path)
        run: npm run build:preview

      - name: Verify build output
        run: |
          test -f dist/portfolio-v2/browser/index.html
          test -f dist/portfolio-v2/browser/en/index.html
          grep -q '<base href="/portfolio-v2/">' dist/portfolio-v2/browser/en/index.html
