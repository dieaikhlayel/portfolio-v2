<article class="projects">
  <h1 class="projects__title">{{ i18n.t().nav.projects }}</h1>
  <p class="projects__intro">{{ i18n.t().projects.intro }}</p>

  <section class="projects__section" aria-labelledby="projects-featured">
    <h2 class="projects__heading" id="projects-featured">{{ i18n.t().projects.featured }}</h2>
    <ul class="projects__grid projects__grid--featured">
      @for (project of featured; track project.id) {
        <li><app-project-card [project]="project" /></li>
      }
    </ul>
  </section>

  <section class="projects__section" aria-labelledby="projects-more">
    <h2 class="projects__heading" id="projects-more">{{ i18n.t().projects.more }}</h2>
    <ul class="projects__grid">
      @for (project of others; track project.id) {
        <li><app-project-card [project]="project" /></li>
      }
    </ul>
  </section>
</article>
