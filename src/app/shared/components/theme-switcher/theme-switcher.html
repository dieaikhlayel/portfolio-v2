<label class="theme-switcher">
  <span class="theme-switcher__label">{{ i18n.t().theme.label }}</span>
  <select class="theme-switcher__select" (change)="onChange($event)">
    @for (choice of choices; track choice) {
      <option [value]="choice" [selected]="choice === theme.choice()">
        {{ i18n.t().theme.options[choice] }}
      </option>
    }
  </select>
</label>
