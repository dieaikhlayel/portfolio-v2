<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Diea Ikhlayel | Portfolio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portfolio of Diea Ikhlayel, a full-stack web developer with IT support experience and cybersecurity knowledge."
    />
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong theme.
      // Keep this list in sync with THEME_IDS in src/app/core/theme/theme.model.ts (a test checks it).
      (function () {
        try {
          var t = localStorage.getItem('portfolio-theme');
          var ids = [
            'light',
            'dark',
            'midnight',
            'forest',
            'ember',
            'violet',
            'contrast',
            'sand',
            'ocean',
            'rose',
          ];
          if (t && ids.indexOf(t) !== -1) {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="any" href="Diea.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
